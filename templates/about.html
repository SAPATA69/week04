{% extends 'layout.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
     <h1>{{ title }}</h1>
     <h2>My name is {{ name }}</h2>
     <h2>My email address is {{ email }}</h2>
     <h2>My mobile phone number is {{ mobile }}</h2>
     
     {% if age >= 50 %}
         <h2>I am older</h2>
     {% else %}
         <h2>I am younger</h2>
     {% endif %}
{% endblock %}
